<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSA - Billing Workbench</title>
  <link rel="stylesheet" href="../../launchpad/psa-shell.css">
  <script src="../../launchpad/psa-shell.js"></script>
  <script id="sap-ui-bootstrap"
    src="https://ui5.sap.com/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-resource-roots='{ "psa.invoices": "./" }'
    data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
    data-sap-ui-compat-version="edge"
    data-sap-ui-async="true"
    data-sap-ui-frame-options="trusted"></script>
</head>
<body class="sapUiBody sapUiSizeCompact">
  <div id="psa-shell" data-title="Billing Workbench"></div>
  <div id="psa-content" data-sap-ui-component data-name="psa.invoices" data-id="container"
    data-settings='{ "id": "psa.invoices" }' data-height="100%" data-handle-validation="true"></div>
</body>
</html>
