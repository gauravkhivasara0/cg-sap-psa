<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSA Launchpad</title>
  <link rel="stylesheet" href="launchpad.css">
  <script src="launchpad.js" defer></script>
</head>
<body>
  <header class="lp-header">
    <span class="lp-brand">Enterprise PSA</span>
    <span class="lp-user" id="lp-user"></span>
    <a href="/do/logout" class="lp-logout">Log out</a>
  </header>
  <main class="lp-main">
    <h1 id="lp-greeting">Loading…</h1>
    <p id="lp-roles" class="lp-roles"></p>
    <div id="lp-messages"></div>
    <div id="lp-groups"></div>
  </main>
</body>
</html>
